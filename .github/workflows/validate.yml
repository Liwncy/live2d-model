name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index:
    name: 校验模型与索引
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 校验每个模型的引用完整性、体积上限、许可字段，
      # 并确认 index.json 与 models/ 当前状态一致（防止提交时忘了跑脚本）
      - name: node tools/build-index.mjs --check
        run: node tools/build-index.mjs --check
